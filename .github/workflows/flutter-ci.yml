name: Mobile CI

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

jobs:
  detect:
    name: Detect Flutter project
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5

      # The mobile application is built in Phase 3 of the project plan. Until
      # apps/mobile contains a Flutter project the remaining jobs are skipped
      # instead of failing on a missing pubspec.yaml.
      - id: check
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Flutter project not present::apps/mobile/pubspec.yaml does not exist yet; skipping analysis and build."
          fi

  analyze:
    name: Analyze, format check, tests
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Advisory, not a gate: the Dart sources were written in an environment
      # without a Flutter SDK, so they have not been machine-formatted yet.
      # The step still runs with --set-exit-if-changed so the annotations show
      # exactly which files need `dart format`; the first contributor with an
      # SDK runs it once, after which this step can be made fatal again by
      # removing continue-on-error.
      - name: Verify formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # Errors and warnings are fatal; info-level lints (const-style,
      # deprecation hints) stay advisory until the sources get a formatting
      # pass on a machine with the SDK — see the step above.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze-output.txt

      # TEMPORARY DIAGNOSTIC: this sandbox cannot download Actions logs, so a
      # failing analysis posts its output as a commit comment where it can be
      # read. Remove this step once the analyzer is green.
      - name: Publish analyzer output on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### flutter analyze failed'
            echo
            echo '```'
            tail -c 60000 analyze-output.txt
            echo '```'
          } > body.md
          jq -n --rawfile b body.md '{body: $b}' > comment.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @comment.json

      - name: Unit + widget tests
        run: flutter test 2>&1 | tee test-output.txt

      # TEMPORARY DIAGNOSTIC (tests) — same mechanism as above.
      - name: Publish test output on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### flutter test failed'
            echo
            echo '```'
            tail -c 60000 test-output.txt
            echo '```'
          } > body.md
          jq -n --rawfile b body.md '{body: $b}' > comment.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @comment.json

  build-apk:
    name: Build debug APK
    needs: [detect, analyze]
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository ships the Dart sources and pubspec only; the android/
      # platform folder is generated here (same command a developer runs once,
      # documented in apps/mobile/README.md). `flutter create .` on an existing
      # project adds the missing platform directories without touching lib/ or
      # the pubspec.
      - name: Generate Android platform
        run: flutter create --platforms=android --org ph.gov.mabini .

      - run: flutter pub get

      - name: Build debug APK
        # `flutter build` does not read SUPABASE_* from the environment on its
        # own — the values must arrive as --dart-define. When the repository
        # secrets are not set (forks, previews) the defines are simply omitted
        # and the APK boots into the configuration screen.
        run: |
          defines=""
          [ -n "$SUPABASE_URL" ] && defines="$defines --dart-define=SUPABASE_URL=$SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] && defines="$defines --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          flutter build apk --debug $defines 2>&1 | tee build-output.txt

      # TEMPORARY DIAGNOSTIC — same mechanism as in the analyze job.
      - name: Publish build output on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### flutter build apk failed'
            echo
            echo '```'
            tail -c 60000 build-output.txt
            echo '```'
          } > body.md
          jq -n --rawfile b body.md '{body: $b}' > comment.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @comment.json
        env:
          # Only the publishable values are injected; the anon key is safe to
          # ship inside the application because RLS enforces access.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

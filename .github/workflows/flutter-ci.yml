name: Mobile CI

on:
  # Push events only fire on main: branch pushes that belong to an open
  # pull request would otherwise trigger a second, duplicate run for the
  # same commit via the pull_request event below.
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

jobs:
  detect:
    name: Detect Flutter project
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5

      # The mobile application is built in Phase 3 of the project plan. Until
      # apps/mobile contains a Flutter project the remaining jobs are skipped
      # instead of failing on a missing pubspec.yaml.
      - id: check
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Flutter project not present::apps/mobile/pubspec.yaml does not exist yet; skipping analysis and build."
          fi

  analyze:
    name: Analyze, format check, tests
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Advisory, not a gate: the Dart sources were written in an environment
      # without a Flutter SDK, so they have not been machine-formatted yet.
      # The step still runs with --set-exit-if-changed so the annotations show
      # exactly which files need `dart format`; the first contributor with an
      # SDK runs it once, after which this step can be made fatal again by
      # removing continue-on-error.
      - name: Verify formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # Errors and warnings are fatal; info-level lints (const-style,
      # deprecation hints) stay advisory until the sources get a formatting
      # pass on a machine with the SDK — see the step above.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      # Retried once on failure: shared GitHub runners occasionally show
      # transient environment failures (package/VM-service hiccups). A
      # deterministic failure fails twice.
      - name: Unit + widget tests
        run: |
          if ! flutter test; then
            echo "::warning::flutter test failed on the first attempt — retrying once"
            flutter test
          fi

  build-apk:
    name: Build debug APK
    needs: [detect, analyze]
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository ships the Dart sources and pubspec only; the android/
      # platform folder is generated here (same command a developer runs once,
      # documented in apps/mobile/README.md). `flutter create .` on an existing
      # project adds the missing platform directories without touching lib/ or
      # the pubspec.
      - name: Generate Android platform
        run: flutter create --platforms=android --org ph.gov.mabini .

      # Flutter 3.47 introduced built-in Kotlin, but several of this app's
      # plugins still ship with the legacy Kotlin Gradle Plugin (file_picker
      # fails at :checkDebugAarMetadata without this). The documented
      # migration path for not-yet-migrated projects
      # (flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin) is
      # to keep legacy mode via these two gradle.properties flags. The flutter
      # tool adds them automatically on interactive builds; android/ is
      # generated here on the fly, so set them explicitly.
      - name: Keep legacy Kotlin Gradle mode
        run: |
          props=android/gradle.properties
          grep -q '^android.builtInKotlin=' "$props" || echo 'android.builtInKotlin=false' >> "$props"
          grep -q '^android.newDsl=' "$props" || echo 'android.newDsl=false' >> "$props"

      - run: flutter pub get

      - name: Build debug APK
        # `flutter build` does not read SUPABASE_* from the environment on its
        # own — the values must arrive as --dart-define. When the repository
        # secrets are not set (forks, previews) the defines are simply omitted
        # and the APK boots into the configuration screen.
        #
        # Retried once on failure: the Gradle dependency download from the
        # Maven/Google mirrors is the step most prone to transient network
        # errors on shared runners. A deterministic failure fails twice.
        run: |
          defines=""
          [ -n "$SUPABASE_URL" ] && defines="$defines --dart-define=SUPABASE_URL=$SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] && defines="$defines --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          if ! flutter build apk --debug $defines; then
            echo "::warning::flutter build apk failed on the first attempt — retrying once"
            flutter build apk --debug $defines
          fi
        env:
          # Only the publishable values are injected; the anon key is safe to
          # ship inside the application because RLS enforces access.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # TEMPORARY diagnostic: surface the build output of the failing run as
      # check-run annotations (::error commands), readable through the
      # check-runs annotations API. Removed once the root cause is fixed.
      - name: Post build diagnostics
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          defines=""
          [ -n "$SUPABASE_URL" ] && defines="$defines --dart-define=SUPABASE_URL=$SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] && defines="$defines --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          flutter build apk --debug $defines > /tmp/build-diag.txt 2>&1
          set -e
          {
            echo '### build failure excerpt'
            grep -n -B 5 -A 25 -m 2 -iE 'what went wrong|execution failed|error:|FAILURE' /tmp/build-diag.txt | head -n 130
            echo '### last lines'
            tail -n 15 /tmp/build-diag.txt
          } > /tmp/build-diag-short.txt
          while IFS= read -r line; do
            esc="${line//'%'/'%25'}"
            esc="${esc//$'\r'/'%0D'}"
            printf '::error title=build-diag::%s\n' "$esc"
          done < /tmp/build-diag-short.txt

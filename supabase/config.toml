# ---------------------------------------------------------------------------
# Supabase local development configuration
# Municipality of Mabini, Batangas — Franchising & Tricycle Driver System
#
# Applied by the Supabase CLI (`supabase start`, `supabase db reset`,
# `supabase functions serve`). The same migrations are deployed to the
# Supabase Cloud project linked with `supabase link`.
# ---------------------------------------------------------------------------

project_id = "sbtf-system"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 10 MiB is enforced again in the mobile upload path (image compression).
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Additional redirect targets for email confirmation / password recovery.
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/reset-password",
  "https://*.vercel.app/auth/confirm",
  "https://*.vercel.app/reset-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Email verification is required for driver self-registration.
enable_confirmations = true
# Local development uses Inbucket (http://localhost:54324) instead of a real SMTP.
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

# Custom templates (bilingual; Tagalog first). These apply to local development
# only — `supabase start` serves them through Inbucket and ignores the hosted
# dashboard builder. For the hosted project, paste the same HTML from
# supabase/templates/ into Dashboard → Authentication → Email Templates.
#
# recovery  : a 6-digit code ({{ .Token }}), typed back into the app's
#             /verify-otp screen. Do NOT put a link in this template — a
#             single-use link can be consumed by a mail scanner before the human
#             opens it. Administrator-issued setup links are built by the
#             admin-users Edge Function and still use /auth/confirm.
# magic_link: the body must contain {{ .Token }}; the mobile app verifies it with
#             auth.verifyOTP({ type: 'email' }).
# confirmation: the signup template; carries {{ .Token }} and is verified with
#             auth.verifyOtp({ type: 'signup' }). A successful verification also
#             creates the session, so the driver is signed in automatically.
[auth.email.template.recovery]
subject = "Your SBTF verification code — SBTF System"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "One-time password — SBTF System"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your SBTF account — verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# --- Edge Functions ---------------------------------------------------------
# AI decision support: must only be callable by an authenticated staff/admin.
[functions.ai-decision-support]
verify_jwt = true

# Admin user provisioning: service-role work, caller role re-verified in code.
[functions.admin-users]
verify_jwt = true

# Self-service password recovery: reachable before sign-in by design, so it
# cannot require a JWT. It reads the caller's role with the service role and
# answers with a constant, enumeration-safe confirmation.
[functions.password-recovery]
verify_jwt = false

# Scheduled renewal reminders: invoked by pg_cron / Supabase scheduled
# functions with a shared secret header instead of a JWT.
[functions.renewal-reminders]
verify_jwt = false

[analytics]
enabled = false

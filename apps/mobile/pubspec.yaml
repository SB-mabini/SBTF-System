name: sbtf_mobile
description: >-
  Driver/operator mobile application for the SBTF System — a Web and
  Mobile-Based Franchising and Tricycle Driver Registration System for the
  Municipality of Mabini, Batangas.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependencies are declared when the slice that uses them lands — nothing
# here is carried "for later". Slices 1–2 needed only state management and the
# Supabase client; slices 3 and 5 pick documentary requirements through
# `file_selector`; slice 6 renders the certificate QR (`qr_flutter`, pure Dart),
# scans one with the camera (`mobile_scanner`) and opens the certificate in the
# browser (`url_launcher`). Declaring native plugins early only couples the
# build to their Android packaging (e.g. file_picker 8.x pins compileSdk 34,
# which the flutter_plugin_android_lifecycle shipped with Flutter 3.47 rejects).
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.13.0
  # Device file chooser for documentary requirements (slice 3/5). Chosen over
  # `file_picker` on purpose: its Android implementation defers `compileSdk` to
  # the app (`compileSdk = flutter.compileSdkVersion`), whereas file_picker 8.x
  # pins compileSdk 34, which the plugin lifecycle package bundled with this
  # Flutter version rejects.
  file_selector: ^0.9.5
  # Slice 6 — certificate QR: render the driver's own QR (pure Dart, no native
  # code), scan a QR with the camera, and open the certificate PDF or the public
  # verification page in the browser.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.jpg"

flutter:
  uses-material-design: true
